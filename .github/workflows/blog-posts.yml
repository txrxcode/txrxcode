name: Latest blog posts
on:
  schedule:
    - cron: "17 11 * * *" # daily, ~6am Toronto
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://txrxcode.com/feed/"
          max_post_count: 6
          template: "- [$title]($url)$newline"
          commit_message: "chore: update latest blog posts"
